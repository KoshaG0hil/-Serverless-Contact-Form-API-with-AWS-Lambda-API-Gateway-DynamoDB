<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS Serverless Contact Form</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; border: 1px solid #334155; padding: 2rem; border-radius: 12px; width: 100%; max-width: 440px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; }
    label { display: block; margin-top: 1rem; font-size: 0.9rem; color: #94a3b8; }
    input, textarea { width: 100%; padding: 10px; margin-top: 6px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; box-sizing: border-box; }
    button { width: 100%; margin-top: 1.5rem; padding: 12px; border-radius: 6px; border: none; background: #0284c7; color: white; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .status { margin-top: 1rem; text-align: center; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📬 Contact Us</h2>
    <form id="contactForm">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required placeholder="Kosha Gohil">

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required placeholder="kosha@example.com">

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" required placeholder="Type your message here..."></textarea>

      <button type="submit">Submit via API Gateway</button>
      <div id="status" class="status"></div>
    </form>
  </div>
</body>
</html>
